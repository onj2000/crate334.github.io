<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明朝体文字ジェネレーター</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fontsから日本語明朝体「Noto Serif JP」を読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Noto Serif JPを明朝体として使用 */
        .font-mincho {
            font-family: 'Noto Serif JP', serif;
        }
        /* 背景画像の設定 */
        #generator-container {
            /* 現在は以前アップロードされた画像を使用しています。
               新しい画像をアップロードした場合は、ファイル名をここに記述してください。
               例: url('新しいファイル名.jpg') */
            background-image: url('image.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 画像が見やすいように影と角丸を設定 */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* 赤い背景とのコントラストを調整するため、暗めのオーバーレイを追加 */
            position: relative;
        }
        #generator-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1); /* わずかに暗くするオーバーレイ */
        }
        #overlay-text {
            z-index: 10; /* オーバーレイより前面に表示 */
        }
    </style>
</head>
<body class="bg-gray-50 antialiased">

    <div id="app" class="p-4 sm:p-8 max-w-7xl mx-auto">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-8 text-gray-900 border-b-4 border-red-500 pb-2">
            明朝体文字ジェネレーター
        </h1>

        <!-- 入力とプレビューエリア -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- 1. プレビュー (画像と文字の合成) -->
            <div class="relative overflow-hidden rounded-xl aspect-square lg:aspect-[4/3] h-auto lg:h-[60vh]" id="generator-container">
                <!-- テキストオーバーレイ -->
                <div id="overlay-text"
                     class="font-mincho absolute inset-0 flex items-center justify-center text-center text-[72px] sm:text-[96px] font-bold p-8 text-yellow-300 drop-shadow-xl transition-all duration-300 whitespace-pre-wrap leading-tight"
                     style="font-size: 72px;">
                    ここに文字が表示されます
                </div>
            </div>

            <!-- 2. コントロールパネル -->
            <div class="space-y-6">
                
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                    <label for="text-input" class="block text-xl font-bold mb-3 text-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block mr-2 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        書き込みたい文字を入力
                    </label>
                    <textarea id="text-input"
                              class="w-full h-40 p-4 border-2 border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500 font-mincho text-2xl resize-none"
                              placeholder="例：豪華絢爛"
                              maxlength="100"></textarea>
                    <p class="text-sm text-gray-500 mt-2 text-right">最大100文字</p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 space-y-4">
                    <h3 class="text-xl font-bold text-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 inline-block mr-2 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0015.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        文字のスタイル設定
                    </h3>
                    
                    <div class="space-y-4">
                        <!-- 文字サイズ -->
                        <div class="pt-2">
                            <label for="font-size-input" class="text-base text-gray-600 font-medium flex justify-between items-center">
                                <span>文字サイズ</span>
                                <span id="current-font-size" class="font-extrabold text-red-600">72px</span>
                            </label>
                            <input type="range" id="font-size-input" min="30" max="150" value="72" class="w-full h-2 bg-red-100 rounded-lg appearance-none cursor-pointer range-lg mt-1 accent-red-500">
                        </div>

                        <!-- 文字色 -->
                        <div>
                            <label for="text-color-input" class="text-base text-gray-600 font-medium block mb-1">文字色</label>
                            <select id="text-color-input" class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-red-500 focus:border-red-500 shadow-sm">
                                <option value="text-yellow-300" class="text-yellow-300">金色 (初期設定)</option>
                                <option value="text-white" class="text-white bg-gray-900">白色</option>
                                <option value="text-gray-200" class="text-gray-200 bg-gray-900">銀色</option>
                                <option value="text-red-500" class="text-red-500">赤色</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="p-4 bg-red-50 border border-red-400 text-red-800 rounded-xl shadow-lg" role="alert">
                    <p class="font-bold">⚠️ 背景画像の更新について</p>
                    <p class="text-sm mt-1">ご指定のGoogle DriveのURL（サムネイルを含む）からの画像読み込みはできませんでした。新しい背景を使用するには、**画像をこのチャットに直接アップロードしてください**。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const textInput = document.getElementById('text-input');
            const overlayText = document.getElementById('overlay-text');
            const fontSizeInput = document.getElementById('font-size-input');
            const currentFontSizeSpan = document.getElementById('current-font-size');
            const textColorInput = document.getElementById('text-color-input');

            // 関数: テキストエリアの内容をプレビューに反映する
            const updateText = () => {
                const text = textInput.value.trim();
                // プレビュー表示用のテキストを更新
                overlayText.textContent = text || 'ここに文字が表示されます';
            };

            // テキスト入力の変更をリアルタイムで反映
            textInput.addEventListener('input', updateText);

            // 関数: フォントサイズを更新する
            const updateFontSize = () => {
                const size = fontSizeInput.value;
                // px単位でフォントサイズを直接設定
                overlayText.style.fontSize = `${size}px`;
                currentFontSizeSpan.textContent = `${size}px`;
            };

            // フォントサイズの変更を反映
            fontSizeInput.addEventListener('input', updateFontSize);

            // 関数: 文字色を更新する
            const updateTextColor = () => {
                const newColorClass = textColorInput.value;
                // Tailwind CSSのtext-クラスを扱うためのリスト
                const colorClasses = ['text-yellow-300', 'text-white', 'text-gray-200', 'text-red-500'];
                
                // 既存のtext-クラスを全て削除
                overlayText.classList.remove(...colorClasses);
                
                // 新しいクラスを追加
                overlayText.classList.add(newColorClass);
            };

            // 文字色の変更を反映
            textColorInput.addEventListener('change', updateTextColor);

            // 初期設定の適用
            updateText();
            updateFontSize();
            updateTextColor();

            // コンソールロギング（デバッグ用: Firebase関連のログは通常不要）
            // console.log("ジェネレーターが初期化されました。");
        });
    </script>
</body>
</html>
